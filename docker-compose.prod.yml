services:
  db:
    image: postgres:16-alpine
    container_name: minierp_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-minierp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set it in .env)}
      POSTGRES_DB: ${DB_NAME:-minierp}
    volumes:
      - minierp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-minierp} -d ${DB_NAME:-minierp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: minierp-backend:latest
    container_name: minierp_prod_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-minierp}:${DB_PASSWORD:?DB_PASSWORD is required (set it in .env)}@db:5432/${DB_NAME:-minierp}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (set it in .env)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy

volumes:
  minierp_pgdata: