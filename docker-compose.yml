services:
  db:
    image: postgres:16-alpine
    container_name: minierp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: minierp
      POSTGRES_PASSWORD: minierp_dev_password
      POSTGRES_DB: minierp
    ports:
      - "5432:5432"
    volumes:
      - minierp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minierp -d minierp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  minierp_pgdata:
